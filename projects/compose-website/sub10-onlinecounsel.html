<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>컴포즈커피-온라인 상담</title>
  <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header include-html="header.html"></header>

  <div class="goto-top">
    <a href="#">
      <img class="before" src="image/gototop-before.png" alt="goto-top-img">
      <img class="after" src="image/gototop-after.png" alt="goto-top-img">
    </a>
  </div>

  <div class="top-common">
    <div class="counsel-bg"></div>    
    <div class="location">
      <a href="index.html">홈</a>
      <span>&gt; 상담신청 &gt;</span>
      <span>가맹 창업 상담</span>
    </div>
    <div class="sub-header scroll-item left-in">
      <h2>온라인 상담</h2>
    </div>
  </div>
  
    <div id="wrap">
      <section class="online-counsel-section">
        <div class="online-counsel-inner">

          <div class="oncounsel-info scroll-item left-in delay1">
            <span class="oncounsel-tag">온라인 상담</span>
            <h3 class="oncounsel-title">가맹 창업<br>상담 신청</h3>
            <p class="oncounsel-desc">컴포즈커피 창업에 관심 있으신가요?<br>간단한 정보를 남겨주시면<br>담당자가 빠르게 연락드립니다.
            </p>
            <div class="oncounsel-contact">
              <p><i class="bx bx-phone" aria-hidden="true"></i>
                1899-5685</p>
              <p><i class="bx bx-envelope" aria-hidden="true"></i> composecoffee@composecoffee.co.kr</p>
              <p><i class="bx bx-clock-8" aria-hidden="true"></i> 평일 09:00 – 18:00</p>
          </div>
        </div>

        <div class="oncounsel-form-wrap">
          <form class="oncounsel-form scroll-item right-in delay1">

            <div class="form-row">
              <div class="form-group">
                <label for="name">성명<span class="required">*</span></label>
                <input type="text" id="name" name="name" placeholder="이름을 입력해주세요">
              </div>
              <div class="form-group">
                <label for="tel">연락처<span class="required">*</span></label>
                <input type="tel" id="tel" name="tel" placeholder="010-1234-5678">
              </div>
            </div>

            <div class="form-group">
              <label for="region">창업 희망 지역<span class="required">*</span></label>
              <select id="region" name="region">
                <option value="" disabled selected>시/도 선택</option>
                <option value="seoul">서울</option>
                <option value="gyeonggi">경기</option>
                <option value="incheon">인천</option>
                <option value="busan">부산</option>
                <option value="daegu">대구</option>
                <option value="daejeon">대전</option>
                <option value="gwangju">광주</option>
                <option value="ulsan">울산</option>
                <option value="sejong">세종</option>
                <option value="gangwon">강원</option>
                <option value="chungbuk">충북</option>
                <option value="chungnam">충남</option>
                <option value="jeonbuk">전북</option>
                <option value="jeonnam">전남</option>
                <option value="gyeongbuk">경북</option>
                <option value="gyeongnam">경남</option>
                <option value="jeju">제주</option>
              </select>
            </div>

            <div class="form-group">
              <label for="message">문의 내용</label>
              <textarea id="message" name="message" placeholder="문의 내용을 입력해주세요."></textarea>
            </div>

            <div class="form-check">
              <input type="checkbox" name="privacy" id="privacy">
              <label for="privacy">개인정보 수집 및 이용에 동의합니다.<span class="required">*
              </span></label>            
            </div>

            <button type="submit" class="form-submit">상담 신청하기</button>
            <p class="counsel-notice">유선 상담 가능 · TEL 1899-5685 · 평일 09:00 – 18:00</p>
          </form>
        </div>



      </div>
    </section>

  <footer include-html="footer.html"></footer>
    </div>
    <script src="js/includeHTML.js"></script>
    <script src="js/index.js"></script>
    <script src="js/sub-script.js"></script>
    <script src="js/scroll.js"></script>
    <script>
      includeHTML(function () {
        initAll();
        if (typeof initMenu === 'function') initMenu();
      });
    </script>
</body>
</html>
