<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #111111;
        font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
        color: #f4f8ff;
      }

      .og-canvas {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      .hero-mesh {
        position: absolute;
        inset: 0;
        filter: blur(44px);
      }

      .hero-mesh-blob {
        position: absolute;
        border-radius: 50%;
      }

      .hero-mesh-blob--1 {
        top: -20%;
        left: -20%;
        width: 900px;
        height: 900px;
        background: radial-gradient(
          circle at 42% 42%,
          rgba(193, 18, 31, 0.18) 0%,
          rgba(165, 14, 25, 0.11) 25%,
          rgba(122, 22, 32, 0.05) 50%,
          rgba(80, 10, 18, 0.01) 72%,
          rgba(193, 18, 31, 0) 88%
        );
      }

      .hero-mesh-blob--2 {
        top: 10%;
        right: -20%;
        width: 920px;
        height: 920px;
        background: radial-gradient(
          circle at 58% 40%,
          rgba(193, 18, 31, 0.15) 0%,
          rgba(158, 13, 22, 0.09) 25%,
          rgba(122, 22, 32, 0.04) 50%,
          rgba(80, 10, 18, 0.01) 72%,
          rgba(193, 18, 31, 0) 88%
        );
      }

      .hero-mesh-blob--3 {
        bottom: -25%;
        left: 5%;
        width: 880px;
        height: 880px;
        background: radial-gradient(
          circle at 48% 58%,
          rgba(9, 2, 3, 0.36) 0%,
          rgba(7, 1, 2, 0.18) 25%,
          rgba(5, 1, 2, 0.06) 50%,
          rgba(3, 0, 1, 0.01) 72%,
          rgba(9, 2, 3, 0) 88%
        );
      }

      .main-hero-block {
        position: absolute;
        top: 72px;
        left: 64px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
        z-index: 1;
      }

      .main-subtitle {
        font-size: 16px;
        font-weight: 500;
        line-height: 1.45;
        letter-spacing: 0.02em;
        white-space: nowrap;
      }

      .main-hero {
        position: relative;
        font-size: 248px;
        line-height: 0.831;
      }

      .main-title {
        font-family: "Bebas Neue", sans-serif;
        font-size: 1em;
        line-height: 0.831;
        letter-spacing: -0.03em;
        color: #f4f8ff;
      }

      .main-title-line {
        display: block;
      }

      .main-portfolio-wrap {
        position: absolute;
        left: 1.096em;
        top: 0.931em;
        width: 0.161em;
        height: 0.616em;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .main-portfolio-label {
        font-family: "Bebas Neue", sans-serif;
        font-size: 0.19em;
        line-height: 0.837;
        color: #8f1022;
        text-transform: lowercase;
        transform: rotate(-90deg);
        white-space: nowrap;
      }

      .main-scroll {
        position: absolute;
        right: 80px;
        bottom: 72px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        z-index: 1;
      }

      .main-scroll-line {
        width: 2px;
        height: 107px;
        background: #f4f8ff;
      }

      .main-scroll-text {
        font-size: 20px;
        font-weight: 600;
        line-height: 1.6;
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <div class="og-canvas">
      <div class="hero-mesh" aria-hidden="true">
        <span class="hero-mesh-blob hero-mesh-blob--1"></span>
        <span class="hero-mesh-blob hero-mesh-blob--2"></span>
        <span class="hero-mesh-blob hero-mesh-blob--3"></span>
      </div>

      <div class="main-hero-block">
        <p class="main-subtitle">UI/UX DESIGNER &amp; WEB PUBLISHER</p>
        <div class="main-hero">
          <h1 class="main-title" aria-label="INSEO">
            <span class="main-title-line">IN</span>
            <span class="main-title-line">SEO</span>
          </h1>
          <div class="main-portfolio-wrap" aria-hidden="true">
            <span class="main-portfolio-label">portfolio</span>
          </div>
        </div>
      </div>

      <div class="main-scroll" aria-hidden="true">
        <span class="main-scroll-line"></span>
        <span class="main-scroll-text">SCROLL</span>
      </div>
    </div>
  </body>
</html>
